name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          while IFS=/ read -r goos goarch name; do
            GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "dist/${name}/dotty" ./cmd/dotty
            tar czf "dist/${name}.tar.gz" -C "dist/${name}" dotty
          done <<EOF
          linux amd64 dotty_Linux_x86_64
          linux arm64 dotty_Linux_arm64
          darwin amd64 dotty_Darwin_x86_64
          darwin arm64 dotty_Darwin_arm64
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
